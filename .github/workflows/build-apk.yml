name: Build AetherDrop Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare Project Structure & Configs
        run: |
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          if [ ! -f "www/index.html" ]; then
            echo "❌ ERROR: index.html not found! Make sure index.html is uploaded to your repo."
            exit 1
          fi
          cat << 'EOF' > package.json
          {
            "name": "aetherdrop-offline",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0"
            }
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aetherdrop.p2p",
            "appName": "AetherDrop",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch AndroidManifest.xml (Camera & Hotspot Permissions)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherDrop-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
